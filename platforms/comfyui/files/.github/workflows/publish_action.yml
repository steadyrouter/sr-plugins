# Runs in the public repository github.com/steadyrouter/comfyui-steadyrouter, which holds the built package
# (pushed there by comfyui-release.yml in sr-plugins). Publishes to the Comfy Registry when pyproject.toml changes.
# One-time setup: Registry publisher → API key → repository secret REGISTRY_ACCESS_TOKEN.
name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pyproject.toml']

permissions:
  contents: read

jobs:
  publish-node:
    if: ${{ github.repository_owner == 'steadyrouter' }}
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit checked on 2026-11-02 (the action runs `comfy node publish`).
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
