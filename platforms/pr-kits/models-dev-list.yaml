  deepseek-v4.1-flash: {lab: deepseek/deepseek-v4.1-flash, effort: [low, high, max], reasoning_field: reasoning_content, toggle: true, toggle_wire: 'thinking.type = enabled|disabled', effort_wire: 'reasoning_effort = low|high|max', probed: 2026-11-06, notes: ['Live 2026-11-06: thinking.type = disabled returned no reasoning (0 reasoning tokens); enabled returned reasoning_content.']}
  kimi-k3: {lab: moonshotai/kimi-k3, effort: [low, high, max], reasoning_field: reasoning_content}
