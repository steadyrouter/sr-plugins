# SteadyRouter model name -> models.dev lab model, with what a live probe through the gateway showed
# (2026-11-02, Claude and images 2026-11-05).
# effort: values from the lab's own host entry; "low" was sent to each and accepted; a few others were sent on 2026-11-06.
# toggle_wire, effort_wire, notes: the header comments models.dev asks for.
# reasoning_field: the field the reply carried reasoning in. Claude's reply carries none.
# glm-5.3 is left out: both probes timed out at 70 seconds.
chat:
