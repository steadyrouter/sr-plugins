  claude-sonnet-5-5: {lab: anthropic/claude-sonnet-5-5, effort: [low, medium, high, xhigh, max], probed: 2026-11-05}
  claude-haiku-5-5: {lab: anthropic/claude-haiku-5-5, effort: [low, medium, high, xhigh, max], probed: 2026-11-05}
  claude-fable-5-1: {lab: anthropic/claude-fable-5-1, effort: [low, medium, high, xhigh, max], probed: 2026-11-05}
  gpt-6-astra: {lab: openai/gpt-6-astra, effort: [low, medium, high, xhigh, max], probed: 2026-11-06, notes: ['tools.freeform left out: with a custom tool forced by tool_choice, replies were plain text and said no tool was available (regex, lark, text), 2026-11-06. A function tool worked.']}
  gpt-6.1-sol: {lab: openai/gpt-6.1-sol, effort: [low, medium, high, xhigh, max], probed: 2026-11-06, notes: ['tools.freeform left out: with a custom tool forced by tool_choice, replies were plain text asking which tool to call (regex, lark, text), 2026-11-06.']}
