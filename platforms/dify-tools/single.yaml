# Plugins named after one popular model, for people who look for that model by name in the Marketplace.
# Same code as SteadyRouter Image & Video, with one model family and its own listing, version and sign-up code.
# package: the key in catalog/site.yaml channel_codes and catalog/versions.yaml, and the folder under dist/.
# only: a model-name prefix, for a plugin whose name promises less than its family holds.
# default: leave out to use the family's default from catalog/families.yaml.
# icon: under brand/. Our own drawing: never the model owner's logo (the Marketplace may ask for proof of rights to one), and
# not the SteadyRouter logo, which stays on the plugins named after the brand.
- package: dify-seedream
  icon: single/dify-seedream.svg
  name: seedream_steadyrouter
  model: Seedream
  owner: ByteDance
  family: seedream
  kind: plain
  what:
    en_US: Generate images with Doubao Seedream
    zh_Hans: 用豆包 Seedream 生成图片
