# Coze plugins. One Cloudflare Worker (worker/) serves every plugin; each plugin is one OpenAPI file that is
# imported into Coze (build.py writes them to dist/coze/openapi/<region>/).

# Where Coze calls the Worker (the OpenAPI servers.url) and the host of the file links users get. Neither is
# written into the Worker code: the Worker answers on any host, and FILES_BASE_URL is a Worker variable.
# Planned: a Cloudflare for SaaS custom hostname routed to the Worker.
api_base: https://files.steadyrouter.com
files_base: https://files.steadyrouter.com

worker_name: sr-coze
bucket: sr-plugin-files
prefix: coze/            # the bucket's lifecycle rule deletes objects under this prefix after keep_days
keep_days: 15

limits:
  request_kb: 64         # largest JSON body the Worker reads from Coze
  prompt_chars: 8000
  reference_images: 4
  image_mb: 20           # per generated image; the Worker holds images in memory (128 MB per isolate)
  video_mb: 200          # per video; streamed to R2 when the gateway sends a length, else buffered
  video_buffer_mb: 90    # largest video the Worker will hold in memory

# Which models each region may use. `all` = every image and video model in the catalog except the ones
# listed under `exclude`. The Worker enforces this too, so a model typed by hand cannot get around it.
regions:
  com:
    lang: en
    families: all
  cn:
    lang: zh
    aff: oYCd            # sign-up code for every plugin in this region; in `com` each plugin has its own
    # This region lists Chinese models and Nano Banana.
    families: [nano_banana, seedream, tongyi_image, seedance, wan_video, vidu]
exclude: [mj_imagine, mj_reroll, mj_upscale, mj_variation]   # Midjourney task models need their own flow

defaults:
  image: gemini-3.1-flash-image
  video: doubao-seedance-2-0-mini-260615

# image.kind picks the image options: nano_banana (aspect ratio, resolution, reference images),
# gpt_image (size, quality), plain (free size), all (every option).
plugins:
  - id: steadyrouter
    aff: it75
    regions: [com, cn]
    name: {en: SteadyRouter Image & Video, zh: SteadyRouter 生图生视频}
    what:
      en: Generate images and videos with the image and video models on SteadyRouter, from one API key
      zh: 用一个 SteadyRouter Key 调用上面的生图、生视频型号
    image: {families: null, kind: all}
    video: {families: null}
  - id: nano_banana
    aff: qpa5
    regions: [com, cn]
    name: {en: Nano Banana (SteadyRouter), zh: Nano Banana（SteadyRouter）}
    what:
      en: Generate and edit images with Gemini image models (Nano Banana) through SteadyRouter
      zh: 通过 SteadyRouter 用 Gemini 生图型号（Nano Banana）生成、修改图片
    image: {families: [nano_banana], kind: nano_banana}
  - id: gpt_image
    aff: EFTl
    regions: [com]
    name: {en: GPT Image (SteadyRouter), zh: GPT Image（SteadyRouter）}
    what:
      en: Generate images with GPT Image models through SteadyRouter
      zh: 通过 SteadyRouter 用 GPT Image 型号生成图片
    image: {families: [gpt_image], kind: gpt_image}
  - id: seedream
    aff: CpN5
    regions: [com, cn]
    name: {en: Seedream (SteadyRouter), zh: Seedream（SteadyRouter）}
    what:
      en: Generate images with Doubao Seedream models through SteadyRouter
      zh: 通过 SteadyRouter 用豆包 Seedream 型号生成图片
    image: {families: [seedream], kind: plain}
  - id: seedance
    aff: t07T
    regions: [com, cn]
    name: {en: Seedance (SteadyRouter), zh: Seedance（SteadyRouter）}
    what:
      en: Generate videos with Doubao Seedance models through SteadyRouter
      zh: 通过 SteadyRouter 用豆包 Seedance 型号生成视频
    video: {families: [seedance]}
  - id: tongyi
    aff: pjx7
    regions: [com, cn]
    name: {en: Wan & Qwen Image (SteadyRouter), zh: 通义万相 & Qwen Image（SteadyRouter）}
    what:
      en: Generate images with Qwen Image and Wan, and videos with Wan, through SteadyRouter
      zh: 通过 SteadyRouter 用 Qwen Image、万相生成图片，用万相生成视频
    image: {families: [tongyi_image], kind: plain}
    video: {families: [wan_video]}
