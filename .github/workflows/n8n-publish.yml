# n8n only verifies community nodes published from GitHub Actions with npm provenance (from 2026-05-01), and its scan
# reads the package source from the attested commit, so the generated package is committed in packages/.
# Publishing uses npm trusted publishing (no token).
# Release: bump `n8n` in catalog/versions.yaml and CHANGELOG, run `python tools/build.py n8n` and copy dist/n8n to
# packages/n8n-nodes-steadyrouter (without node_modules and dist), commit, push a tag n8n-v<version>.
name: Publish n8n package

on:
  push:
    tags: ['n8n-v*.*.*']

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the committed package matches the generator
        run: |
          pip install pyyaml==6.0.3
          python tools/build.py n8n
          diff -r --exclude=node_modules --exclude=dist dist/n8n packages/n8n-nodes-steadyrouter
          version="$(python -c "import yaml; print(yaml.safe_load(open('catalog/versions.yaml'))['n8n'])")"
          test "n8n-v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - name: Build and lint
        working-directory: packages/n8n-nodes-steadyrouter
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx n8n-node build
          npx n8n-node lint

      - name: Publish with provenance
        working-directory: packages/n8n-nodes-steadyrouter
        env:
          RELEASE_MODE: 'true' # the package's prepublishOnly hook refuses to publish without it
        run: npm publish --provenance --access public
